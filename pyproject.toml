[project]
name = "busca-transparencia-goias"
version = "0.1.0"
description = "Hub de consulta de transparencia publica dos municipios de Goias (portal nucleogov)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.48",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "pypdf>=5.0"]

[project.scripts]
busca-go = "busca_go.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["busca_go*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"